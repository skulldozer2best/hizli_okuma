<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Medya Oynatıcı</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .container {
            background: #fff;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            max-width: 700px;
            width: 100%;
            text-align: center;
        }

        video {
            width: 100%;
            border-radius: 10px;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.5);
            justify-content: center;
            align-items: center;
        }

        .modal-content {
            background: #fff;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
        }

        .modal button {
            padding: 10px 20px;
            margin: 10px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        .continue {
            background-color: #28a745;
            color: white;
        }

        .cancel {
            background-color: #dc3545;
            color: white;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Medya Oynatıcı</h1>
        <video id="myVideo" controls>
            <source src="HızlıOkuma.mp4" type="video/mp4">
            Tarayıcınız video etiketini desteklemiyor.
        </video>
    </div>

    <div id="modal" class="modal">
        <div class="modal-content">
            <p>Videoya devam edilsin mi?</p>
            <button class="continue">Evet</button>
            <button class="cancel">Hayır</button>
        </div>
    </div>

    <script>
        const video = document.getElementById('myVideo');
        const modal = document.getElementById('modal');
        const continueButton = document.querySelector('.continue');
        const cancelButton = document.querySelector('.cancel');

        let interval;

        video.addEventListener('play', () => {
            interval = setInterval(checkVideoTime, 60000);
        });

        video.addEventListener('pause', () => {
            clearInterval(interval);
        });

        function checkVideoTime() {
            video.pause();
            modal.style.display = 'flex';
        }

        continueButton.addEventListener('click', () => {
            modal.style.display = 'none';
            video.play();
        });

        cancelButton.addEventListener('click', () => {
            modal.style.display = 'none';
        });
    </script>
</body>
</html>
